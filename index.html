/* ============================== helpers ============================== */
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function toKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function parseKey(k) { var p = k.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function isFridayDate(d) { return d.getDay() === 5; }
function addDays(d, n) { var nd = new Date(d); nd.setDate(nd.getDate() + n); return nd; }
function clamp0(n) { return Math.max(0, n); }
function ratingOf(score) { for (var i = 0; i < RATING_BANDS.length; i++) if (score >= RATING_BANDS[i].min) return RATING_BANDS[i]; return RATING_BANDS[RATING_BANDS.length - 1]; }
function taskLabel(t, lang) { return lang === "ar" ? t.name_ar : t.name_en; }
function catLabel(c, lang) { return c ? (lang === "ar" ? c.name_ar : c.name_en) : ""; }
function escAttr(s) { return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function escHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function isTaskScheduled(task, dateObj) {
  if (!task.active) return false;
  var key = toKey(dateObj);
  if (task.startDate && key < task.startDate) return false;
  if (task.endDate && key > task.endDate) return false;
  var wd = dateObj.getDay();
  if (task.repeat === "daily") return true;
  if (task.repeat === "exceptFriday") return wd !== 5;
  if (task.repeat === "custom") return (task.days || []).indexOf(wd) !== -1;
  return true;
}

function buildItemsForDate(tasks, dateObj) {
  return tasks.filter(function (t) { return isTaskScheduled(t, dateObj); }).map(function (t) {
    return { taskId: t.id, name_ar: t.name_ar, name_en: t.name_en, type: t.type, points: t.points, priority: t.priority, categoryId: t.categoryId, completed: false };
  });
}

function mergeCompletions(liveItems, storedItems) {
  var map = {};
  (storedItems || []).forEach(function (i) { map[i.taskId] = i.completed; });
  return liveItems.map(function (i) { var c = map[i.taskId]; return Object.assign({}, i, { completed: !!c }); });
}

function statsFromItems(items, rewardThreshold) {
  var required = items.filter(function (i) { return i.type === "task" || i.type === "habit" || i.type === "challenge"; });
  var available = required.reduce(function (s, i) { return s + i.points; }, 0);
  var earnedRequired = required.filter(function (i) { return i.completed; }).reduce(function (s, i) { return s + i.points; }, 0);
  var bonus = items.filter(function (i) { return i.type === "optional" && i.completed; }).reduce(function (s, i) { return s + i.points; }, 0);
  var penalty = items.filter(function (i) { return i.type === "negative" && i.completed; }).reduce(function (s, i) { return s + i.points; }, 0);
  var earned = clamp0(earnedRequired + bonus - penalty);
  var score = available > 0 ? (earned / available) * 100 : 0;
  return {
    available: available, earned: earned, score: score, rating: ratingOf(score), reward: score >= rewardThreshold,
    completedCount: required.filter(function (i) { return i.completed; }).length, totalCount: required.length
  };
}

function loadAll() {

  var fin = storage.get("finance");
  S.finance = fin || { salary: 0, expenses: [], savingsTx: [] };
  if (!S.finance.savingsTx) S.finance.savingsTx = [];
  S.tasks = t || DEMO_TASKS.slice();
  S.categories = c || DEFAULT_CATEGORIES;
  S.settings = s ? Object.assign({}, DEFAULT_SETTINGS, s) : Object.assign({}, DEFAULT_SETTINGS);
  S.records = r || {};

  var now = new Date();
  var nowKey = toKey(now);
  if (S.settings.lastOpenDate && S.settings.lastOpenDate < nowKey) {
    var oldKey = S.settings.lastOpenDate;
    if (S.records[oldKey] && !isFridayDate(parseKey(oldKey))) {
      S.records[oldKey] = Object.assign({}, S.records[oldKey], { archived: true });
    }
    var cursor = addDays(parseKey(oldKey), 1);
    var stop = parseKey(nowKey);
    while (cursor < stop) {
      var ck = toKey(cursor);
      if (!isFridayDate(cursor)) {
        if (S.settings.missingDayBehavior === "countAsZero") {
          S.records[ck] = { items: buildItemsForDate(S.tasks, cursor), note: "", archived: true, status: "zero" };
        } else if (S.settings.missingDayBehavior === "markAsMissing") {
          S.records[ck] = { items: [], note: "", archived: true, status: "missing" };
        }
      }
      cursor = addDays(cursor, 1);
    }
  }
  S.settings.lastOpenDate = nowKey;
  persistSettings(); persistRecords();
}

/* ============================== derived data ============================== */
function today() { return new Date(); }
function todayKeyStr() { return toKey(today()); }
function L() { return STR[S.settings.language]; }
function isDark() { return S.settings.theme === "dark" || (S.settings.theme === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); }

function todayItems() {
  var live = buildItemsForDate(S.tasks, today());
  var rec = S.records[todayKeyStr()];
  return mergeCompletions(live, rec ? rec.items : null);
}
function todayStats() { return statsFromItems(todayItems(), S.settings.rewardThreshold); }

function statsForDate(dateObj) {
  var key = toKey(dateObj);
  if (key === todayKeyStr()) { var st = todayStats(); return Object.assign({}, st, { items: todayItems(), status: "live" }); }
  var rec = S.records[key];
  if (!rec || rec.status === "missing") return null;
  var items = rec.items || [];
  return Object.assign({}, statsFromItems(items, S.settings.rewardThreshold), { items: items, status: rec.status || "ok" });
}

function weekRange() {
  var t = today(); var dow = t.getDay(); var sinceSat = (dow - 6 + 7) % 7;
  var start = addDays(t, -sinceSat); var out = [];
  for (var i = 0; i < 6; i++) { out.push(addDays(start, i)); }
  return out;
}
function monthRange() {
  var t = today(); var start = new Date(t.getFullYear(), t.getMonth(), 1);
  var daysInMonth = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  var out = [];
  for (var i = 0; i < daysInMonth; i++) { out.push(addDays(start, i)); }
  return out;
}
function aggregate(dates) {
  var earned = 0, available = 0; var t = today();
  dates.forEach(function (d) {
    if (isFridayDate(d)) return;
    if (d > t) {
      var liveItems = buildItemsForDate(S.tasks, d);
      var req = liveItems.filter(function (i) { return i.type === "task" || i.type === "habit" || i.type === "challenge"; });
      available += req.reduce(function (s, i) { return s + i.points; }, 0);
      return;
    }
    var st = statsForDate(d); if (!st) return;
    earned += st.earned; available += st.available;
  });
  return available > 0 ? (earned / available) * 100 : 0;
}

function computeStreaks() {
  var cursor = new Date(today()); var current = 0;
  while (true) {
    if (isFridayDate(cursor)) { cursor = addDays(cursor, -1); continue; }
    var st = statsForDate(cursor);
    if (!st || st.available === 0) break;
    if (st.score >= S.settings.streakThreshold) { current++; cursor = addDays(cursor, -1); } else break;
  }
  var allKeys = Object.keys(S.records).filter(function (k) { return !isFridayDate(parseKey(k)); }).sort();
  var longest = 0, run = 0;
  allKeys.forEach(function (k) {
    var st = statsForDate(parseKey(k));
    if (st && st.available > 0 && st.score >= S.settings.streakThreshold) { run++; longest = Math.max(longest, run); } else run = 0;
  });
  longest = Math.max(longest, current);
  return { current: current, longest: longest };
}

function computeAllTime() {
  var keys = Object.keys(S.records).filter(function (k) { return k !== todayKeyStr(); });
  var best = null, worst = null, totalPoints = 0, completed = 0, missed = 0, sumScore = 0, count = 0;
  function consider(key, st) {
    if (!st || st.available === 0) return;
    count++; sumScore += st.score; totalPoints += st.earned;
    completed += st.completedCount; missed += (st.totalCount - st.completedCount);
    if (!best || st.score > best.score) best = { key: key, score: st.score };
    if (!worst || st.score < worst.score) worst = { key: key, score: st.score };
  }
  keys.forEach(function (k) { consider(k, statsForDate(parseKey(k))); });
  var tst = todayStats();
  consider(todayKeyStr(), tst.available > 0 ? tst : null);
  return { best: best, worst: worst, totalPoints: totalPoints, completed: completed, missed: missed, avg: count > 0 ? sumScore / count : 0 };
}

function computeLast7() {
  var t = today(); var out = [];
  for (var i = -6; i <= 0; i++) {
    var d = addDays(t, i);
    if (isFridayDate(d)) { out.push({ label: d.getDate(), score: null }); continue; }
    var st = statsForDate(d);
    out.push({ label: d.getDate(), score: st && st.available > 0 ? Math.round(st.score) : null });
  }
  return out;
}

function computeCategoryPerf() {
  var keys = Object.keys(S.records).concat([todayKeyStr()]);
  var map = {};
  keys.forEach(function (k) {
    var items = k === todayKeyStr() ? todayItems() : (S.records[k] ? S.records[k].items : []);
    (items || []).forEach(function (i) {
      if (["task", "habit", "challenge"].indexOf(i.type) === -1) return;
      map[i.categoryId] = map[i.categoryId] || { total: 0, done: 0 };
      map[i.categoryId].total++;
      if (i.completed) map[i.categoryId].done++;
    });
  });
  return S.categories.map(function (c) {
    var m = map[c.id];
    return { name: catLabel(c, S.settings.language), value: m ? Math.round((m.done / m.total) * 100) : 0, color: c.color, has: !!m };
  }).filter(function (c) { return c.has; });
}

function monthExpenses() {
  var t = today(); var ym = t.getFullYear() + "-" + pad(t.getMonth() + 1);
  return S.finance.expenses.filter(function (e) { return e.date && e.date.slice(0, 7) === ym; });
}
function weekExpenses() {
  var keys = weekRange().map(toKey);
  return S.finance.expenses.filter(function (e) { return keys.indexOf(e.date) !== -1; });
}
function sumExpenses(list) { return list.reduce(function (s, e) { return s + e.amount; }, 0); }
function savingsBalance() {
  return S.finance.savingsTx.reduce(function (s, t) { return s + (t.type === "deposit" ? t.amount : -t.amount); }, 0);
}
function monthSavingsNet() {
  var t = today(); var ym = t.getFullYear() + "-" + pad(t.getMonth() + 1);
  var list = S.finance.savingsTx.filter(function (x) { return x.date && x.date.slice(0, 7) === ym; });
  return list.reduce(function (s, x) { return s + (x.type === "deposit" ? x.amount : -x.amount); }, 0);
}
function financeCategoryBreakdown() {
  var list = monthExpenses();
  var map = {};
  list.forEach(function (e) { map[e.categoryId] = (map[e.categoryId] || 0) + e.amount; });
  var total = sumExpenses(list);
  return EXPENSE_CATEGORIES.map(function (c) {
    var amt = map[c.id] || 0;
    return { id: c.id, name: catLabel(c, S.settings.language), color: c.color, amount: amt, pct: total > 0 ? Math.round((amt / total) * 100) : 0 };
  }).filter(function (c) { return c.amount > 0; });
}

function renderLineSpark(data) {
  var w = 300, h = 150, padd = 24;
  var stepX = (w - padd*2) / Math.max(1, data.length-1);
  var pts = data.map(function(d, i){ return d.score===null ? null : [padd + i*stepX, padd + (1 - d.score/100) * (h - padd*2)]; });
  var pathD = ""; var started = false;
  pts.forEach(function(p){ if (!p) { started = false; return; } pathD += (started?"L":"M") + p[0] + "," + p[1] + " "; started = true; });
  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '">';
  [0,25,50,75,100].forEach(function(g){ var y = padd + (1-g/100)*(h-padd*2); svg += '<line x1="'+padd+'" x2="'+(w-padd)+'" y1="'+y+'" y2="'+y+'" stroke="#DCD6C4" stroke-dasharray="3 3"/>'; });
  svg += '<path d="' + pathD + '" fill="none" stroke="#D6A15C" stroke-width="2.5"/>';
  pts.forEach(function(p){ if (p) svg += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="#D6A15C"/>'; });
  data.forEach(function(d, i){ svg += '<text x="'+(padd+i*stepX)+'" y="'+(h-4)+'" font-size="9" fill="#8B9089" text-anchor="middle">'+d.label+'</text>'; });
  svg += '</svg>';
  return svg;
}
function renderBarMini(data) {
  var w = 300, h = 170, padd = 20, gap = 10;
  var barW = (w - padd*2) / data.length - gap;
  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '">';
  [0,50,100].forEach(function(g){ var y = padd + (1-g/100)*(h-padd*2-14); svg += '<line x1="'+padd+'" x2="'+(w-padd)+'" y1="'+y+'" y2="'+y+'" stroke="#DCD6C4" stroke-dasharray="3 3"/>'; });
  data.forEach(function(d, i){
    var x = padd + i*(barW+gap); var barH = (d.value/100)*(h-padd*2-14); var y = padd + (h-padd*2-14) - barH;
    svg += '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+barH+'" rx="4" fill="'+d.color+'"/>';

}

      html += '<span style="width:8px;height:8px;border-radius:50%;background:' + b.color + ';min-width:8px;"></span>';
      html += '<span style="flex:1;font-size:13.5px;">' + b.name + '</span>';
      html += '<span style="font-size:13px;font-weight:700;color:#1F3A3D;">' + b.amount + ' (' + b.pct + '%)</span>';
      html += '</div>';
    });
    html += '</section>';
  }

  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h2 class="section-title" style="margin:0;">' + l.expenseList + '</h2><button class="btn-primary" style="padding:8px 14px;" data-act="openAddExpense">+ ' + l.addExpense + '</button></div>';

  if (!allExpenses.length) html += '<p style="color:#8B9089;font-size:14px;">' + l.noExpenses + '</p>';
  allExpenses.forEach(function (e) {
    var cat = EXPENSE_CATEGORIES.find(function (c) { return c.id === e.categoryId; });
    html += '<div class="card" style="display:flex;align-items:center;gap:10px;margin-bottom:10px;" data-act="openEditExpense" data-val="' + e.id + '">';
    html += '<span style="width:8px;height:8px;border-radius:50%;background:' + (cat ? cat.color : '#8B9089') + ';min-width:8px;"></span>';
    html += '<div style="flex:1;"><p style="font-size:14.5px;font-weight:700;margin:0 0 2px;">' + (cat ? catLabel(cat, S.settings.language) : '') + (e.note ? (' · ' + escHtml(e.note)) : '') + '</p>';
    html += '<p style="font-size:12px;color:#8B9089;margin:0;">' + e.date + '</p></div>';
    html += '<span style="font-size:15px;font-weight:800;color:#B5563C;">-' + e.amount + '</span>';
    html += '<button data-act="askDeleteExpense" data-val="' + e.id + '" style="background:none;border:none;cursor:pointer;font-size:15px;color:#B5563C;">🗑</button>';
    html += '</div>';
  });

  html += '</div>';
  return html;
}

function renderSettings() {
  var l = L();
  var html = '<div style="padding:22px 18px;"><h1 style="font-size:21px;font-weight:800;color:#1F3A3D;margin-bottom:18px;">' + l.settings + '</h1>';
  html += '<div class="field"><label class="label">' + l.language + '</label><div class="chips-row">' +
    ['ar','en'].map(function(lg){ return '<button class="chip ' + (S.settings.language===lg?'active':'') + '" data-act="setSetting" data-key="language" data-val="'+lg+'">' + (lg==='ar'?'العربية':'English') + '</button>'; }).join('') + '</div></div>';
  html += '<div class="field"><label class="label">' + l.theme + '</label><div class="chips-row">' +
    [['light',l.light],['dark',l.dark],['system',l.system]].map(function(p){ return '<button class="chip ' + (S.settings.theme===p[0]?'active':'') + '" data-act="setSetting" data-key="theme" data-val="'+p[0]+'">' + p[1] + '</button>'; }).join('') + '</div></div>';

  html += '<div class="field"><label class="label">' + l.missingDayBehavior + '</label><div class="chips-row">' +
    [['ignoreDay',l.ignoreDay],['countAsZero',l.countAsZero],['markAsMissing',l.markAsMissing]].map(function(p){ return '<button class="chip ' + (S.settings.missingDayBehavior===p[0]?'active':'') + '" data-act="setSetting" data-key="missingDayBehavior" data-val="'+p[0]+'">' + p[1] + '</button>'; }).join('') + '</div></div>';
  html += '<div class="field"><label class="label">' + l.notifications + '</label><button class="btn-ghost ' + (S.settings.notifications?'active':'') + '" style="' + (S.settings.notifications?'background:#1F3A3D;color:#fff;':'') + '" data-act="toggleNotif">' + (S.settings.notifications?l.active:l.cancel) + '</button><p style="font-size:11.5px;color:#8B9089;margin-top:5px;">' + l.notifNote + '</p></div>';

  html += '<section style="margin-top:10px;margin-bottom:20px;"><h2 class="section-title">' + l.backup + '</h2>';
  html += '<button class="btn-ghost" style="width:100%;margin-bottom:10px;" data-act="doExport">⬇ ' + l.exportData + '</button>';
  if (S.exportedJson) {
    html += '<textarea class="input" readonly style="min-height:90px;font-size:11px;" onclick="this.select()">' + escHtml(S.exportedJson) + '</textarea>';
    html += '<a download="daily-progress-backup.json" href="data:application/json,' + encodeURIComponent(S.exportedJson) + '" style="font-size:12.5px;color:#D6A15C;font-weight:700;display:block;margin:6px 0 14px;">' + l.downloadFile + '</a>';
  }
  html += '<textarea class="input" style="min-height:70px;font-size:12px;margin-bottom:8px;" placeholder="' + escAttr(l.pasteJson) + '" data-act="setImportTextInput">' + escHtml(S.importText) + '</textarea>';
  html += '<button class="btn-ghost" style="width:100%;" data-act="doImport">⬆ ' + l.applyImport + '</button>';
  html += '</section>';

  html += '<section>';
  if (!S.confirmingReset) {
    html += '<button class="btn-ghost" style="color:#B5563C;border-color:#B5563C;width:100%;" data-act="askReset">' + l.resetData + '</button>';
  } else {
    html += '<div class="card" style="border:1.5px solid #B5563C;"><p style="font-size:13px;margin-bottom:12px;">' + l.confirmReset + '</p><div style="display:flex;gap:8px;">';
    html += '<button class="btn-ghost" style="flex:1;" data-act="cancelReset">' + l.cancel + '</button>';
    html += '<button class="btn-primary" style="flex:1;background:#B5563C;" data-act="doReset">' + l.yes + '</button></div></div>';
  }
  html += '</section></div>';
  return html;
}

/* ============================== EVENT DELEGATION ============================== */
function attachHandlers() {
  var root = document.getElementById("root");
  root.onclick = function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");
    var val = el.getAttribute("data-val");
    var key = el.getAttribute("data-key");
    if (act === "setTab") setTab(val);
    else if (act === "toggleItem") toggleItem(val);
    else if (act === "toggleDayItem") toggleDayItem(key, val);
    else if (act === "openAddTask") openAddTask();
    else if (act === "openEditTask") openEditTask(val);
    else if (act === "closeTaskModal") closeTaskModal();
    else if (act === "closeTaskModalOverlay") { if (e.target === el) closeTaskModal(); }
    else if (act === "toggleTaskActive") toggleTaskActive(val);
    else if (act === "askDeleteTask") askDeleteTask(val);
    else if (act === "cancelDeleteTask") cancelDeleteTask();
    else if (act === "confirmDeleteTask") confirmDeleteTask();
    else if (act === "cancelDeleteTaskOverlay") { if (e.target === el) cancelDeleteTask(); }
    else if (act === "saveTaskModal") saveTaskModal();
    else if (act === "modalField" && val !== null) updateModalField(key, val);
    else if (act === "modalDay") toggleModalDay(Number(val));
    else if (act === "openDayModal") openDayModal(val);
    else if (act === "closeDayModal") closeDayModal();
    else if (act === "closeDayModalOverlay") { if (e.target === el) closeDayModal(); }
    else if (act === "setHistoryView") setHistoryView(val);
    else if (act === "calMonthShift") calMonthShift(Number(val));
    else if (act === "setSetting") setSetting(key, val);
    else if (act === "toggleNotif") setSetting("notifications", !S.settings.notifications);
    else if (act === "doExport") doExport();
    else if (act === "doImport") doImport();
    else if (act === "askReset") askReset();
    else if (act === "cancelReset") cancelReset();
    else if (act === "doReset") doReset();
    else if (act === "completeOnboarding") completeOnboarding();
    else if (act === "openAddExpense") openAddExpense();
    else if (act === "openEditExpense") openEditExpense(val);
    else if (act === "closeFinanceModal") closeFinanceModal();
    else if (act === "closeFinanceModalOverlay") { if (e.target === el) closeFinanceModal(); }
    else if (act === "saveFinanceModal") saveFinanceModal();
    else if (act === "financeField" && val !== null) updateFinanceField(key, val);
    else if (act === "askDeleteExpense") askDeleteExpense(val);
    else if (act === "cancelDeleteExpense") cancelDeleteExpense();
    else if (act === "confirmDeleteExpense") confirmDeleteExpense();
    else if (act === "cancelDeleteExpenseOverlay") { if (e.target === el) cancelDeleteExpense(); }
    else if (act === "openAddSaving") openAddSaving();
    else if (act === "openEditSaving") openEditSaving(val);
    else if (act === "closeSavingModal") closeSavingModal();
    else if (act === "closeSavingModalOverlay") { if (e.target === el) closeSavingModal(); }
    else if (act === "saveSavingModal") saveSavingModal();
    else if (act === "savingField" && val !== null) updateSavingField(key, val);
    else if (act === "askDeleteSaving") askDeleteSaving(val);
    else if (act === "cancelDeleteSaving") cancelDeleteSaving();
    else if (act === "confirmDeleteSaving") confirmDeleteSaving();
    else if (act === "cancelDeleteSavingOverlay") { if (e.target === el) cancelDeleteSaving(); }
  };
  root.oninput = function (e) {
    var el = e.target;
    var act = el.getAttribute("data-act");
    if (!act) return;
    if (act === "setNoteInput") setNote(el.value);
    else if (act === "modalField") updateModalFieldSilent(el.getAttribute("data-key"), el.value);
    else if (act === "modalFieldNum") updateModalFieldSilent(el.getAttribute("data-key"), Number(el.value));
    else if (act === "setSettingNum") setSettingSilent(el.getAttribute("data-key"), Number(el.value));
    else if (act === "setImportTextInput") setImportText(el.value);
    else if (act === "setSalaryInput") { S.finance.salary = Number(el.value) || 0; persistFinance(); }
    else if (act === "financeField") updateFinanceFieldSilent(el.getAttribute("data-key"), el.value);
    else if (act === "financeFieldNum") updateFinanceFieldSilent(el.getAttribute("data-key"), Number(el.value));
    else if (act === "savingField") updateSavingFieldSilent(el.getAttribute("data-key"), el.value);
    else if (act === "savingFieldNum") updateSavingFieldSilent(el.getAttribute("data-key"), Number(el.value));
  };
}

/* ============================== INIT ============================== */
loadAll();
render();
